<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sudoku Puzzles | MT Games</title>
<meta name="description" content="Play 9 sudoku puzzles — Easy, Medium, and Hard — on MT Games." />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    padding: 28px 20px 64px;
  }

  .page-wrap { max-width: 560px; margin: 0 auto; }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .logo-img { height: 36px; width: auto; object-fit: contain; }

  .logo-text {
    font-size: 1.05rem;
    font-weight: 800;
    background: linear-gradient(90deg, #f72585, #7209b7, #4cc9f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-actions { display: flex; align-items: center; gap: 10px; }

  .back-link {
    color: #a0aec0;
    text-decoration: none;
    font-size: 0.84rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .back-link:hover { color: #4cc9f0; }

  .page-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(76,201,240,0.1);
    border: 1px solid rgba(76,201,240,0.25);
    color: #4cc9f0;
    padding: 5px 13px;
    border-radius: 999px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    font-weight: 800;
    white-space: nowrap;
  }

  /* ── Hero ── */
  .hero-section { text-align: center; margin-bottom: 36px; }

  .hero-title {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #4cc9f0, #7209b7, #f72585);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
  }

  .hero-subtitle {
    font-size: 0.9rem;
    color: #94a3b8;
    line-height: 1.7;
    max-width: 440px;
    margin: 0 auto;
  }

  /* ── Difficulty selector ── */
  .selector-section { margin-bottom: 20px; }

  .selector-label {
    font-size: 0.68rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #4cc9f0;
    margin-bottom: 10px;
  }

  .diff-tabs {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 5px;
  }

  .diff-tab {
    flex: 1;
    padding: 9px 8px;
    border: none;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    background: transparent;
    color: #64748b;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .diff-tab.active-easy   { background: linear-gradient(90deg, #06d6a0, #118ab2); color: #fff; }
  .diff-tab.active-medium { background: linear-gradient(90deg, #ffd166, #ef476f); color: #1a1a2e; }
  .diff-tab.active-hard   { background: linear-gradient(90deg, #f72585, #7209b7); color: #fff; }
  .diff-tab:not([class*="active"]):hover { color: #fff; background: rgba(255,255,255,0.08); }

  .puzzle-tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .puzzle-tab {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: #64748b;
    transition: all 0.2s;
    text-align: center;
  }

  .puzzle-tab.active {
    background: rgba(76,201,240,0.12);
    border-color: #4cc9f0;
    color: #4cc9f0;
  }

  .puzzle-tab:not(.active):hover { color: #fff; border-color: rgba(255,255,255,0.25); }

  /* ── Timer bar (only stat shown) ── */
  .timer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 11px 18px;
    margin-bottom: 18px;
  }

  .timer-icon { font-size: 0.95rem; opacity: 0.7; }

  .timer-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: #64748b;
    font-weight: 800;
  }

  .timer-value {
    margin-left: auto;
    font-size: 1.5rem;
    font-weight: 800;
    color: #4cc9f0;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    line-height: 1;
  }

  /* ── 6×6 Sudoku grid ── */
  .grid-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .sudoku-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    border: 3px solid rgba(76,201,240,0.65);
    border-radius: 6px;
    overflow: hidden;
    width: min(360px, 92vw);
    aspect-ratio: 1 / 1;
  }

  .sudoku-cell {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1rem, 4.5vw, 1.4rem);
    font-weight: 700;
    cursor: pointer;
    border-right: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    transition: background 0.12s;
    user-select: none;
    position: relative;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Vertical 2×3 box separator — after col 2 (every 6th+3rd child) */
  .sudoku-cell:nth-child(6n+3) {
    border-right: 2px solid rgba(76,201,240,0.5);
  }

  /* Horizontal 2×3 box separator — after row 1 (cells 7-12) and row 3 (cells 19-24) */
  .sudoku-cell:nth-child(n+7):nth-child(-n+12),
  .sudoku-cell:nth-child(n+19):nth-child(-n+24) {
    border-bottom: 2px solid rgba(76,201,240,0.5);
  }

  .sudoku-cell.given {
    background: rgba(76,201,240,0.1);
    color: #4cc9f0;
    cursor: default;
    font-weight: 800;
  }

  .sudoku-cell.editable { color: #f1f5f9; }
  .sudoku-cell.editable:hover { background: rgba(255,255,255,0.08); }

  .sudoku-cell.selected {
    background: rgba(114,9,183,0.32) !important;
    box-shadow: inset 0 0 0 2px rgba(114,9,183,0.75);
  }

  .sudoku-cell.error-cell {
    background: rgba(239,71,111,0.2) !important;
    color: #ef476f !important;
  }

  .sudoku-cell.correct-cell {
    background: rgba(6,214,160,0.14) !important;
    color: #06d6a0 !important;
  }

  /* ── Action buttons ── */
  .action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .btn-check {
    flex: 1;
    padding: 13px 16px;
    border: none;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .btn-check:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-submit { background: linear-gradient(90deg, #06d6a0, #118ab2); color: #fff; }
  .btn-reset  { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #fff; }

  /* ── Feedback message ── */
  .game-message {
    display: none;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    text-align: center;
    line-height: 1.5;
  }

  .game-message.success {
    display: block;
    background: rgba(6,214,160,0.14);
    border: 1px solid rgba(6,214,160,0.4);
    color: #06d6a0;
  }

  .game-message.error {
    display: block;
    background: rgba(239,71,111,0.1);
    border: 1px solid rgba(239,71,111,0.35);
    color: #ef476f;
  }

  /* ── User modal ── */
  .user-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,14,28,0.88);
    backdrop-filter: blur(8px);
    z-index: 900;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .user-modal-overlay.show { display: flex; }

  .user-modal-card {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  .user-modal-title {
    font-size: 1.35rem;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #f72585, #4cc9f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .user-modal-copy {
    font-size: 0.86rem;
    color: #94a3b8;
    margin-bottom: 22px;
    line-height: 1.6;
  }

  .username-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }

  .username-input:focus { border-color: #4cc9f0; }

  .user-modal-error {
    font-size: 0.78rem;
    color: #ef476f;
    min-height: 20px;
    margin-bottom: 10px;
  }

  .btn-primary {
    width: 100%;
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #f72585, #7209b7);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.4px;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Hidden input — captures keyboard/mobile input when a cell is selected */
  #mobileInput {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: none;
    background: transparent;
  }
</style>
</head>
<body>

<!-- Hidden input for keyboard/mobile capture -->
<input id="mobileInput" type="text" inputmode="numeric" autocomplete="off" />

<!-- User Sign-in Modal -->
<div class="user-modal-overlay" id="userModal">
  <div class="user-modal-card">
    <div class="user-modal-title">🧩 Join MT Games</div>
    <p class="user-modal-copy">Enter a username to track your puzzle times and rankings.</p>
    <input id="usernameInput" class="username-input" type="text" maxlength="24" placeholder="e.g. tapo22" autocomplete="off" />
    <div class="user-modal-error" id="usernameError"></div>
    <button class="btn-primary" id="usernameBtn" onclick="trackClick('sudoku_sign_in_submit'); createUserAccount()">Continue →</button>
  </div>
</div>

<div class="page-wrap">

  <!-- Header -->
  <header class="page-header">
    <a href="index.html" class="logo-wrap" onclick="trackClick('sudoku_logo_click')">
      <img src="mtgames_logo.png" alt="MT Games" class="logo-img" />
      <span class="logo-text">MT Games</span>
    </a>
    <div class="header-actions">
      <a href="leaderboard.html" class="back-link" onclick="trackClick('sudoku_to_leaderboard')">🏆 Leaderboard</a>
      <span class="page-eyebrow">🧩 Sudoku</span>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero-section">
    <h1 class="hero-title">Sudoku Arena</h1>
    <p class="hero-subtitle">
      Choose your difficulty, pick a puzzle, and beat the clock.<br>
      Tap any empty cell and type directly to fill it in.
    </p>
  </section>

  <!-- Difficulty + Puzzle selectors -->
  <div class="selector-section">
    <div class="selector-label">Difficulty</div>
    <div class="diff-tabs">
      <button class="diff-tab active-easy" id="tab-easy"   onclick="selectDifficulty('easy')">✅ Easy</button>
      <button class="diff-tab"             id="tab-medium" onclick="selectDifficulty('medium')">⚡ Medium</button>
      <button class="diff-tab"             id="tab-hard"   onclick="selectDifficulty('hard')">🔥 Hard</button>
    </div>
    <div class="puzzle-tabs">
      <button class="puzzle-tab active" id="ptab-1" onclick="selectPuzzle(1)">Puzzle 1</button>
      <button class="puzzle-tab"        id="ptab-2" onclick="selectPuzzle(2)">Puzzle 2</button>
      <button class="puzzle-tab"        id="ptab-3" onclick="selectPuzzle(3)">Puzzle 3</button>
    </div>
  </div>

  <!-- Timer bar (only stat shown in UI) -->
  <div class="timer-bar">
    <span class="timer-icon">⏱</span>
    <span class="timer-label">Time</span>
    <span class="timer-value" id="timerDisplay">0:00</span>
  </div>

  <!-- 6×6 Sudoku grid -->
  <div class="grid-wrap">
    <div class="sudoku-grid" id="sudokuGrid"></div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="btn-check btn-submit" onclick="checkSolution()">✓ Check Solution</button>
    <button class="btn-check btn-reset"  onclick="resetPuzzle()">↺ Reset</button>
  </div>

  <!-- Feedback message -->
  <div class="game-message" id="gameMessage"></div>

</div><!-- /page-wrap -->

<script>
  // ── Constants ──────────────────────────────────────────────
  const USER_ID_KEY   = 'mtgames_user_id';
  const USER_NAME_KEY = 'mtgames_user_name';
  const GRID_SIZE     = 6;

  // ── 6×6 Puzzle data ─────────────────────────────────────────
  // Stored as pairs: [puzzle_grid, solution_grid]
  // Rules: 6 rows × 6 cols, numbers 1–6, 2×3 boxes
  //
  // Three verified solution grids (A, B, C):
  //   Grid A:  1,2,3,4,5,6 / 4,5,6,1,2,3 / 2,3,1,5,6,4 / 5,6,4,2,3,1 / 3,1,5,6,4,2 / 6,4,2,3,1,5
  //   Grid B:  1,3,2,4,6,5 / 4,6,5,1,3,2 / 2,4,3,5,1,6 / 5,1,6,2,4,3 / 3,5,4,6,2,1 / 6,2,1,3,5,4
  //   Grid C:  2,1,4,3,6,5 / 3,6,5,2,1,4 / 1,2,3,4,5,6 / 4,5,6,1,2,3 / 5,3,1,6,4,2 / 6,4,2,5,3,1

  const PUZZLES = {
    easy: [
      // Easy 1 — Grid A (~19 givens)
      [
        [1,0,0,4,0,6],
        [0,5,0,0,2,3],
        [2,0,1,0,6,0],
        [0,6,0,2,0,1],
        [3,0,5,0,4,0],
        [6,4,0,3,1,0]
      ],
      [
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [2,3,1,5,6,4],
        [5,6,4,2,3,1],
        [3,1,5,6,4,2],
        [6,4,2,3,1,5]
      ],
      // Easy 2 — Grid B (~20 givens)
      [
        [1,3,0,4,0,5],
        [4,0,5,0,3,2],
        [0,4,0,5,1,0],
        [5,0,6,0,4,0],
        [0,5,0,6,2,0],
        [6,0,1,0,0,4]
      ],
      [
        [1,3,2,4,6,5],
        [4,6,5,1,3,2],
        [2,4,3,5,1,6],
        [5,1,6,2,4,3],
        [3,5,4,6,2,1],
        [6,2,1,3,5,4]
      ],
      // Easy 3 — Grid C (~21 givens)
      [
        [2,0,4,0,6,5],
        [3,6,0,2,0,4],
        [0,2,3,0,5,0],
        [4,0,0,1,2,3],
        [5,0,1,0,4,0],
        [0,4,0,5,3,0]
      ],
      [
        [2,1,4,3,6,5],
        [3,6,5,2,1,4],
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [5,3,1,6,4,2],
        [6,4,2,5,3,1]
      ]
    ],
    medium: [
      // Medium 1 — Grid A (~13 givens)
      [
        [1,0,0,0,0,6],
        [0,0,6,1,0,0],
        [0,3,0,0,6,0],
        [5,0,0,0,3,0],
        [0,0,5,6,0,0],
        [6,0,0,0,1,5]
      ],
      [
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [2,3,1,5,6,4],
        [5,6,4,2,3,1],
        [3,1,5,6,4,2],
        [6,4,2,3,1,5]
      ],
      // Medium 2 — Grid B (~13 givens)
      [
        [0,3,0,0,6,0],
        [4,0,0,1,0,0],
        [0,0,3,0,0,6],
        [0,1,0,0,4,0],
        [3,0,0,6,0,0],
        [6,0,1,0,0,4]
      ],
      [
        [1,3,2,4,6,5],
        [4,6,5,1,3,2],
        [2,4,3,5,1,6],
        [5,1,6,2,4,3],
        [3,5,4,6,2,1],
        [6,2,1,3,5,4]
      ],
      // Medium 3 — Grid C (~14 givens)
      [
        [0,1,0,3,0,0],
        [3,0,5,0,0,4],
        [0,0,0,4,5,0],
        [0,5,6,0,0,0],
        [5,3,0,0,4,0],
        [0,0,2,0,3,0]
      ],
      [
        [2,1,4,3,6,5],
        [3,6,5,2,1,4],
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [5,3,1,6,4,2],
        [6,4,2,5,3,1]
      ]
    ],
    hard: [
      // Hard 1 — Grid A (~11 givens)
      [
        [0,0,3,0,0,0],
        [0,5,0,1,0,0],
        [0,0,0,0,6,4],
        [5,0,4,0,0,0],
        [0,0,0,6,0,2],
        [6,4,0,0,0,0]
      ],
      [
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [2,3,1,5,6,4],
        [5,6,4,2,3,1],
        [3,1,5,6,4,2],
        [6,4,2,3,1,5]
      ],
      // Hard 2 — Grid B (~12 givens)
      [
        [1,0,0,0,0,5],
        [0,0,5,0,3,0],
        [0,4,0,0,1,0],
        [0,1,0,2,0,0],
        [3,0,0,0,0,1],
        [0,2,0,0,5,0]
      ],
      [
        [1,3,2,4,6,5],
        [4,6,5,1,3,2],
        [2,4,3,5,1,6],
        [5,1,6,2,4,3],
        [3,5,4,6,2,1],
        [6,2,1,3,5,4]
      ],
      // Hard 3 — Grid C (~12 givens)
      [
        [2,0,0,0,6,0],
        [0,0,5,2,0,0],
        [0,2,0,0,0,6],
        [4,0,0,0,2,0],
        [0,3,0,6,0,0],
        [0,0,2,0,3,0]
      ],
      [
        [2,1,4,3,6,5],
        [3,6,5,2,1,4],
        [1,2,3,4,5,6],
        [4,5,6,1,2,3],
        [5,3,1,6,4,2],
        [6,4,2,5,3,1]
      ]
    ]
  };

  // ── Game state ──────────────────────────────────────────────
  let currentDifficulty = 'easy';
  let currentPuzzleNum  = 1;
  let playerGrid        = [];
  let givenGrid         = [];
  let selectedCell      = null;
  let timerInterval     = null;
  let startTime         = null;
  let attemptsCount     = 0;   // tracked internally, not shown in UI
  let puzzleSolved      = false;

  // ── User helpers ────────────────────────────────────────────
  function getCurrentUser() {
    return { id: localStorage.getItem(USER_ID_KEY), name: localStorage.getItem(USER_NAME_KEY) };
  }

  function showUsernameModal() {
    const modal = document.getElementById('userModal');
    const input = document.getElementById('usernameInput');
    const err   = document.getElementById('usernameError');
    if (err)   err.textContent = '';
    if (input) input.value = '';
    if (modal) modal.classList.add('show');
    setTimeout(() => input && input.focus(), 80);
  }

  function hideUsernameModal() {
    document.getElementById('userModal')?.classList.remove('show');
  }

  function sanitizeUsername(name) {
    return String(name || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  }

  async function createUserAccount() {
    const input     = document.getElementById('usernameInput');
    const err       = document.getElementById('usernameError');
    const btn       = document.getElementById('usernameBtn');
    const cleanName = sanitizeUsername(input ? input.value : '');
    if (!cleanName || cleanName.length < 3) {
      if (err) err.textContent = 'At least 3 characters. Letters, numbers, or underscore only.';
      if (input) input.focus();
      return;
    }
    try {
      if (err) err.textContent = '';
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      const res  = await fetch('/api/create-ipl-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_name: cleanName })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not create user.');
      localStorage.setItem(USER_ID_KEY, data.user.id);
      localStorage.setItem(USER_NAME_KEY, data.user.user_name);
      hideUsernameModal();
    } catch (error) {
      if (err) err.textContent = error.message || 'Something went wrong. Try again.';
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Continue →'; }
    }
  }

  // ── Tracking ────────────────────────────────────────────────
  function trackClick(buttonName, metadata = {}) {
    const { id: userId, name: userName } = getCurrentUser();
    fetch('/api/track-click', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({
        user_id:        userId ? Number(userId) : null,
        user_name:      userName || null,
        event_name:     'button_click',
        button_name:    buttonName,
        page_name:      'sudoku.html',
        page_url:       window.location.pathname,
        event_metadata: { difficulty: currentDifficulty, puzzle_number: currentPuzzleNum, ...metadata }
      })
    }).catch(() => {});
  }

  // ── Timer ───────────────────────────────────────────────────
  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 500);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function updateTimerDisplay() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('timerDisplay').textContent = `${m}:${String(s).padStart(2,'0')}`;
  }

  function getElapsed() {
    return startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
  }

  // ── Puzzle data helpers ──────────────────────────────────────
  function getPuzzleData(difficulty, puzzleNum) {
    const list = PUZZLES[difficulty];
    const idx  = (puzzleNum - 1) * 2;
    return { puzzle: list[idx], solution: list[idx + 1] };
  }

  // ── Load puzzle ──────────────────────────────────────────────
  function loadPuzzle(difficulty, puzzleNum) {
    puzzleSolved      = false;
    attemptsCount     = 0;
    selectedCell      = null;
    currentDifficulty = difficulty;
    currentPuzzleNum  = puzzleNum;
    hideMessage();
    stopTimer();

    document.getElementById('timerDisplay').textContent = '0:00';

    const { puzzle } = getPuzzleData(difficulty, puzzleNum);
    playerGrid = puzzle.map(row => [...row]);
    givenGrid  = puzzle.map(row => row.map(v => v !== 0));

    renderGrid();
    startTimer();
    trackClick('sudoku_load_puzzle', { difficulty, puzzle_number: puzzleNum });
  }

  // ── Render 6×6 grid ─────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('sudokuGrid');
    grid.innerHTML = '';

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'sudoku-cell ' + (givenGrid[r][c] ? 'given' : 'editable');
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.textContent = playerGrid[r][c] !== 0 ? playerGrid[r][c] : '';

        if (!givenGrid[r][c]) {
          cell.addEventListener('click', () => selectCell(r, c));
        }

        grid.appendChild(cell);
      }
    }
  }

  function getCellEl(row, col) {
    return document.querySelector(`.sudoku-cell[data-row="${row}"][data-col="${col}"]`);
  }

  // ── Cell selection ───────────────────────────────────────────
  function selectCell(row, col) {
    if (givenGrid[row][col] || puzzleSolved) return;

    if (selectedCell) {
      getCellEl(selectedCell.row, selectedCell.col)?.classList.remove('selected');
    }
    selectedCell = { row, col };
    getCellEl(row, col)?.classList.add('selected');

    // Focus hidden input so mobile keyboard appears and desktop keystrokes are captured
    const mi = document.getElementById('mobileInput');
    if (mi) { mi.value = ''; mi.focus(); }
  }

  // ── Input a number into selected cell ───────────────────────
  function inputNumber(n) {
    if (!selectedCell || puzzleSolved) return;
    const { row, col } = selectedCell;
    if (givenGrid[row][col]) return;

    playerGrid[row][col] = n;
    const el = getCellEl(row, col);
    if (el) {
      el.textContent = n !== 0 ? n : '';
      el.classList.remove('error-cell', 'correct-cell');
    }
    hideMessage();
  }

  // ── Hidden input handlers (keyboard + mobile) ────────────────
  document.getElementById('mobileInput').addEventListener('keydown', function(e) {
    if (!selectedCell) return;
    const { row, col } = selectedCell;

    // Arrow key navigation — skip over given cells
    const nav = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] };
    if (nav[e.key]) {
      e.preventDefault();
      const [dr, dc] = nav[e.key];
      let nr = row + dr, nc = col + dc;
      while (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && givenGrid[nr][nc]) {
        nr += dr; nc += dc;
      }
      if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) selectCell(nr, nc);
      return;
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      inputNumber(0);
      return;
    }

    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 6) { e.preventDefault(); inputNumber(n); }
    // Swallow 7–9 and 0 so they don't land in the input value
    if (['0','7','8','9'].includes(e.key)) e.preventDefault();
  });

  document.getElementById('mobileInput').addEventListener('input', function() {
    // Mobile fires 'input' instead of 'keydown'; extract last digit typed
    const raw = this.value.replace(/\D/g, '');
    this.value = '';
    if (!raw) return;
    const n = parseInt(raw.slice(-1), 10);
    if (n >= 1 && n <= 6) inputNumber(n);
  });

  // ── Check solution ───────────────────────────────────────────
  function checkSolution() {
    if (puzzleSolved) return;
    attemptsCount++;
    trackClick('sudoku_check_solution', { attempt: attemptsCount });

    const { solution } = getPuzzleData(currentDifficulty, currentPuzzleNum);

    let allFilled  = true;
    let allCorrect = true;

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const el = getCellEl(r, c);
        if (!el || givenGrid[r][c]) continue;
        el.classList.remove('error-cell', 'correct-cell');
        if (playerGrid[r][c] === 0) { allFilled = false; continue; }
        if (playerGrid[r][c] === solution[r][c]) {
          el.classList.add('correct-cell');
        } else {
          el.classList.add('error-cell');
          allCorrect = false;
        }
      }
    }

    if (!allFilled) {
      showMessage('error', '⚠️ Some cells are still empty. Fill in all cells before checking.');
      return;
    }

    if (allCorrect) {
      puzzleSolved = true;
      stopTimer();
      const elapsed = getElapsed();
      showMessage('success', `🎉 Brilliant! You solved the ${currentDifficulty.toUpperCase()} puzzle in ${formatTime(elapsed)}!`);
      saveAttempt(true, elapsed);
      trackClick('sudoku_solved', { time_seconds: elapsed, attempts: attemptsCount });
    } else {
      showMessage('error', `❌ Some cells are incorrect — keep going! (Check #${attemptsCount})`);
      saveAttempt(false, null);
    }
  }

  function resetPuzzle() {
    trackClick('sudoku_reset_puzzle');
    loadPuzzle(currentDifficulty, currentPuzzleNum);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${m}:${String(s % 60).padStart(2,'0')}`;
  }

  // ── Messages ─────────────────────────────────────────────────
  function showMessage(type, text) {
    const el = document.getElementById('gameMessage');
    el.className = `game-message ${type}`;
    el.textContent = text;
  }

  function hideMessage() {
    const el = document.getElementById('gameMessage');
    el.className = 'game-message';
    el.textContent = '';
  }

  // ── Save attempt to backend ──────────────────────────────────
  async function saveAttempt(completedCorrectly, timeTakenSeconds) {
    const { id: userId } = getCurrentUser();
    if (!userId) return;
    try {
      await fetch('/api/save-sudoku-attempt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id:             Number(userId),
          difficulty:          currentDifficulty,
          puzzle_number:       currentPuzzleNum,
          attempts_count:      attemptsCount,
          time_taken_seconds:  timeTakenSeconds,
          completed_correctly: completedCorrectly
        })
      });
    } catch (err) {
      console.warn('Could not save sudoku attempt:', err);
    }
  }

  // ── Selectors ────────────────────────────────────────────────
  function selectDifficulty(diff) {
    ['easy','medium','hard'].forEach(d => {
      const tab = document.getElementById(`tab-${d}`);
      if (tab) tab.className = 'diff-tab' + (d === diff ? ` active-${d}` : '');
    });
    currentDifficulty = diff;
    selectPuzzle(1);
    trackClick('sudoku_select_difficulty', { difficulty: diff });
  }

  function selectPuzzle(num) {
    [1,2,3].forEach(n => {
      const tab = document.getElementById(`ptab-${n}`);
      if (tab) tab.className = 'puzzle-tab' + (n === num ? ' active' : '');
    });
    loadPuzzle(currentDifficulty, num);
    trackClick('sudoku_select_puzzle', { puzzle_number: num });
  }

  // ── Init ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    // Username modal Enter key
    const usernameInput = document.getElementById('usernameInput');
    if (usernameInput) {
      usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') createUserAccount(); });
    }

    const user = getCurrentUser();
    if (!user.id || !user.name) showUsernameModal();

    loadPuzzle('easy', 1);
  });
</script>

</body>
</html>
