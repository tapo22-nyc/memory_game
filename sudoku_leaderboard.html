<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sudoku Leaderboard | MT Games</title>
<meta name="description" content="See the fastest Sudoku solves on MT Games." />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #f8fafc;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #111827;
    padding: 28px 20px 64px;
  }

  .page-wrap { max-width: 520px; margin: 0 auto; }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .logo-img { height: 36px; width: auto; object-fit: contain; }

  .logo-text {
    font-size: 1.05rem;
    font-weight: 800;
    background: linear-gradient(90deg, #f72585, #7209b7, #4cc9f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nav-link {
    color: #6b7280;
    text-decoration: none;
    font-size: 0.84rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .nav-link:hover { color: #2563eb; }

  /* ── Hero ── */
  .lb-hero {
    text-align: center;
    margin-bottom: 32px;
  }

  .lb-hero-title {
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.15;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .lb-hero-sub {
    font-size: 0.88rem;
    color: #6b7280;
  }

  /* ── Table card ── */
  .lb-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
  }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
  }

  .lb-table thead tr {
    background: #dbeafe;
    border-bottom: 1px solid #bfdbfe;
  }

  .lb-table th {
    padding: 14px 18px;
    text-align: left;
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #2563eb;
  }

  .lb-table th.col-time { text-align: right; }

  .lb-table tbody tr {
    border-bottom: 1px solid #f3f4f6;
    transition: background 0.15s;
  }

  .lb-table tbody tr:last-child { border-bottom: none; }
  .lb-table tbody tr:hover { background: #f8fafc; }

  .lb-table td {
    padding: 15px 18px;
    font-size: 0.92rem;
    color: #374151;
  }

  .lb-table td.col-time {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: #2563eb;
  }

  .diff-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: capitalize;
  }

  .diff-badge.easy   { background: rgba(72,199,142,0.18); color: #48c78e; }
  .diff-badge.medium { background: rgba(255,179,71,0.18);  color: #ffb347; }
  .diff-badge.hard   { background: rgba(247,37,133,0.18);  color: #f72585; }

  /* ── Loading / empty state ── */
  .lb-state {
    padding: 48px 20px;
    text-align: center;
    color: #6b7280;
    font-size: 0.9rem;
  }

  .spinner {
    display: inline-block;
    width: 28px;
    height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NGH76BBT"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="page-wrap">

  <!-- Header -->
  <header class="page-header">
    <a href="index.html" class="logo-wrap" onclick="trackClick('lb_logo_click')">
      <img src="mtgames_logo.png" alt="MT Games" class="logo-img" />
      <span class="logo-text">MT Games</span>
    </a>
    <nav>
      <a href="sudoku.html" class="nav-link" onclick="trackClick('lb_back_to_sudoku')">← Back to Sudoku</a>
    </nav>
  </header>

  <!-- Hero -->
  <div class="lb-hero">
    <div class="lb-hero-title">Sudoku Leaderboard</div>
  </div>

  <!-- Table -->
  <div class="lb-card" id="lbCard">
    <div id="lb-content" class="lb-state">
      <div class="spinner"></div><br/>Loading…
    </div>
  </div>

  <!-- Admin link — intentionally subtle -->
  <div style="text-align:right; margin:10px 2px 4px; font-size:0.7rem;">
    <a href="manual-scoring.html"
       style="color:#9ca3af; text-decoration:none; opacity:0.45;"
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.45'">Additional Settings</a>
  </div>
</div><!-- /page-wrap -->

<script>
  const USER_ID_KEY   = 'mtgames_user_id';
  const USER_NAME_KEY = 'mtgames_user_name';

  function trackClick(buttonName, extraMeta = {}) {
    const userId   = localStorage.getItem(USER_ID_KEY);
    const userName = localStorage.getItem(USER_NAME_KEY);
    fetch('/api/track-click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id:        userId   ? Number(userId) : null,
        user_name:      userName || 'anonymous',
        button_name:    buttonName,
        page_name:      'sudoku_leaderboard',
        event_metadata: { page: 'sudoku_leaderboard', ...extraMeta }
      })
    }).catch(() => {});
  }

  function formatTime(seconds) {
    if (seconds == null) return '—';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadLeaderboard() {
    const card    = document.getElementById('lbCard');
    const content = document.getElementById('lb-content');

    try {
      const res = await fetch('/api/get-sudoku-leaderboard');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { rows } = await res.json();

      if (!rows || rows.length === 0) {
        content.innerHTML = '<p>No solves yet — be the first! 🎯</p>';
        return;
      }

      const bodyRows = rows.map(row => `
        <tr>
          <td>${escHtml(row.user_name)}</td>
          <td><span class="diff-badge ${escHtml(row.difficulty)}">${escHtml(row.difficulty)}</span></td>
          <td class="col-time">${formatTime(row.time_taken_seconds)}</td>
        </tr>
      `).join('');

      card.innerHTML = `
        <table class="lb-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>Difficulty</th>
              <th class="col-time">Time Taken</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
        </table>
      `;

      trackClick('lb_loaded', { row_count: rows.length });
    } catch (err) {
      content.innerHTML = '<p>Could not load leaderboard. Please try again later.</p>';
      console.error(err);
    }
  }

  loadLeaderboard();
</script>
</body>
</html>
