<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spelling Bee Leaderboard | MT Games</title>
<meta name="description" content="Spelling Bee leaderboard — see who found the most words." />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #f8fafc;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #111827;
    padding: 28px 20px 64px;
  }

  .page-wrap { max-width: 560px; margin: 0 auto; }

  /* ── Page header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .logo-img { height: 36px; width: auto; object-fit: contain; }

  .logo-text {
    font-size: 1.05rem;
    font-weight: 800;
    background: linear-gradient(90deg, #f72585, #7209b7, #4cc9f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hamburger-wrapper { position: relative; }
  .hamburger-menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .hamburger-menu-btn span {
    display: block;
    width: 24px;
    height: 2px;
    background: #374151;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .hamburger-menu-btn:hover span { background: #2563eb; }
  .hamburger-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width: 200px;
    z-index: 1000;
    overflow: hidden;
  }
  .hamburger-dropdown.open { display: block; }
  .hamburger-dropdown a {
    display: block;
    padding: 12px 18px;
    color: #374151;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.15s;
  }
  .hamburger-dropdown a:hover { background: #f3f4f6; color: #2563eb; }

  /* ── Hero ── */
  .lb-hero {
    text-align: center;
    margin-bottom: 32px;
  }

  .lb-hero-title {
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.15;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ffd166, #f72585, #7209b7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .lb-hero-sub {
    font-size: 0.88rem;
    color: #6b7280;
    line-height: 1.6;
  }

  /* ── Refresh button ── */
  .refresh-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }

  .btn-refresh {
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    color: #6b7280;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-refresh:hover { background: #e5e7eb; color: #374151; }

  /* ── Table card ── */
  .lb-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    overflow: hidden;
  }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
  }

  .lb-table thead th {
    padding: 14px 18px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #2563eb;
    background: #dbeafe;
    border-bottom: 1px solid #bfdbfe;
  }

  .lb-table thead th:last-child { text-align: right; }

  .lb-table tbody tr {
    border-bottom: 1px solid #f3f4f6;
    transition: background 0.15s;
  }
  .lb-table tbody tr:last-child { border-bottom: none; }
  .lb-table tbody tr:hover { background: #f8fafc; }

  .lb-table tbody td {
    padding: 13px 18px;
    font-size: 0.88rem;
    color: #374151;
    vertical-align: middle;
  }

  .lb-table tbody td:last-child { text-align: right; }


  .puzzle-chip {
    display: inline-flex;
    align-items: center;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #6b7280;
    letter-spacing: 0.3px;
  }

  .diff-pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: capitalize;
  }
  .diff-pill.easy   { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; }
  .diff-pill.medium { background: #fef9c3; border: 1px solid #fde68a; color: #92400e; }
  .diff-pill.hard   { background: #fce7f3; border: 1px solid #f9a8d4; color: #9d174d; }

  .username-cell {
    font-weight: 700;
    color: #111827;
  }

  .words-count {
    font-weight: 800;
    font-size: 1rem;
    background: linear-gradient(90deg, #ffd166, #f72585);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Empty / loading states ── */
  .lb-empty {
    text-align: center;
    padding: 56px 24px;
    color: #9ca3af;
    font-size: 0.9rem;
  }

  .lb-loading {
    text-align: center;
    padding: 56px 24px;
    color: #2563eb;
    font-size: 0.9rem;
  }


  /* ── Back link ── */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #6b7280;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 0;
    margin-bottom: 20px;
    transition: color 0.2s;
  }
  .back-link:hover { color: #2563eb; }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    margin-top: 48px;
    font-size: 0.75rem;
    color: #9ca3af;
  }

  @media (max-width: 440px) {
    .lb-table thead th,
    .lb-table tbody td { padding: 12px 12px; }
    .lb-hero-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- ── Page header ── -->
  <div class="page-header">
    <a href="/" class="logo-wrap" onclick="trackClick('bee_lb_logo')">
      <img src="mtgames_logo.png" alt="MT Games" class="logo-img" />
      <span class="logo-text">MT Games</span>
    </a>
    <div class="hamburger-wrapper">
      <button class="hamburger-menu-btn" id="hamburgerMenuBtn" aria-label="Open menu" onclick="toggleHamburgerMenu()">
        <span></span><span></span><span></span>
      </button>
      <nav class="hamburger-dropdown" id="hamburgerDropdown">
        <a href="spelling-bee.html" onclick="trackClick('bee_lb_nav_play')">🐝 Play Spelling Bee</a>
        <a href="spelling-bee.html" onclick="trackClick('bee_lb_nav_htp')">❓ How to Play</a>
        <a href="index.html" onclick="trackClick('bee_lb_nav_home')">🏠 Home</a>
      </nav>
    </div>
  </div>

  <!-- ── Back link ── -->
  <a href="spelling-bee.html" class="back-link" onclick="trackClick('bee_lb_back')">&#8592; Back to Spelling Bee</a>

  <!-- ── Hero ── -->
  <div class="lb-hero">
    <div class="lb-hero-title">Spelling Bee<br/>Leaderboard</div>
    <div class="lb-hero-sub">Top players ranked by number of correct words found per puzzle.</div>
  </div>

  <!-- ── Table ── -->
  <div class="lb-card">
    <div id="lb-body">
      <div class="lb-loading">Loading leaderboard…</div>
    </div>
  </div>

  <!-- ── Refresh ── -->
  <div class="refresh-row" style="margin-top:14px;">
    <button class="btn-refresh" onclick="loadLeaderboard()" id="refresh-btn">⟳ Refresh</button>
  </div>

  <!-- ── Footer ── -->
  <div class="site-footer">© 2025 MT Games. All rights reserved.</div>

</div>

<script>
  const USER_ID_KEY   = 'mtgames_user_id';
  const USER_NAME_KEY = 'mtgames_user_name';

  window.addEventListener('DOMContentLoaded', loadLeaderboard);

  async function loadLeaderboard() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled    = true;
    btn.textContent = '⟳ Loading…';

    try {
      const resp = await fetch('/api/get-spelling-bee-leaderboard');
      const data = await resp.json();

      if (!resp.ok || data.error) {
        renderError(data.error || 'Failed to load leaderboard');
        return;
      }

      renderTable(data.rows || []);
      trackClick('bee_lb_load');
    } catch (err) {
      renderError('Connection error. Please refresh.');
    } finally {
      btn.disabled    = false;
      btn.textContent = '⟳ Refresh';
    }
  }

  function renderTable(rows) {
    const body = document.getElementById('lb-body');

    if (rows.length === 0) {
      body.innerHTML = '<div class="lb-empty">No entries yet. Be the first to play!</div>';
      return;
    }

    let html = `
      <table class="lb-table">
        <thead>
          <tr>
            <th>Difficulty Level</th>
            <th>Player Name</th>
            <th>Words Found</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach((row) => {
      const diff = (row.difficulty || '').toLowerCase();
      const diffHtml = diff
        ? `<span class="diff-pill ${diff}">${diff}</span>`
        : '<span style="color:#9ca3af">—</span>';
      html += `
        <tr>
          <td>${diffHtml}</td>
          <td class="username-cell">${escHtml(row.user_name || '—')}</td>
          <td><span class="words-count">${row.correct_words_count}</span></td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    body.innerHTML = html;
  }

  function renderError(msg) {
    document.getElementById('lb-body').innerHTML =
      '<div class="lb-empty" style="color:#ef476f;">' + escHtml(msg) + '</div>';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function toggleHamburgerMenu() {
    document.getElementById('hamburgerDropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e) {
    const btn = document.getElementById('hamburgerMenuBtn');
    const dropdown = document.getElementById('hamburgerDropdown');
    if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const dropdown = document.getElementById('hamburgerDropdown');
      if (dropdown) dropdown.classList.remove('open');
    }
  });

  function trackClick(buttonName, metadata = {}) {
    const userId   = localStorage.getItem(USER_ID_KEY);
    const userName = localStorage.getItem(USER_NAME_KEY);
    fetch('/api/track-click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        user_id:     userId ? Number(userId) : null,
        user_name:   userName || null,
        event_name:  'button_click',
        button_name: buttonName,
        page_name:   'spelling-bee-leaderboard.html',
        page_url:    window.location.pathname,
        event_metadata: metadata
      })
    }).catch(() => {});
  }
</script>

</body>
</html>
